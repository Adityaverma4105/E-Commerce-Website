<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Shoply — Home</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <!-- <link rel="stylesheet" href="style.css" /> -->
  <link rel="stylesheet" href="newstyle.css">
  <link rel="stylesheet" href="features.css">
</head>
<body>
  <header class="header">
    <div class="container nav">
      <a href="index.html" class="brand">Shoply</a>
      <div class="navlinks">
        <a href="product.html" class="btn">Products</a>
        <a href="cart.html" class="btn">Cart</a>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <div>
        <h1>Small store — real style</h1>
        <p>Clean static demo shop. Browse products and add to cart. Everything stored locally in your browser.</p>
        <p >
            <a href="product.html" class="btn">
                Browse Products →</a>
            </p>
      </div>
      <img src="https://picsum.photos/seed/hero/600/360" alt="hero" >
    </section>

    <section>
      <h2>✨ Featured Products</h2>
      <div id="featured" class="grid"></div>
    </section>
  </main>

  <script src="app.js"></script>
  <script>
    function renderStars(rating) {
      const fullStars = Math.floor(rating);
      const hasHalf = rating % 1 !== 0;
      let stars = '★'.repeat(fullStars);
      if (hasHalf) stars += '½';
      stars += '☆'.repeat(5 - Math.ceil(rating));
      return stars;
    }

    function formatPrice(price, discount) {
      if (discount && discount > 0) {
        const discountedPrice = price * (1 - discount / 100);
        return `<span style="text-decoration: line-through; color: #999; font-size: 0.9rem;">$${price.toFixed(2)}</span> 
                <span style="color: #ef4444; font-weight: bold;">$${discountedPrice.toFixed(2)}</span>`;
      }
      return `$${price.toFixed(2)}`;
    }

    // render first 3 products as featured
    const featuredRoot = document.getElementById('featured');
    const featured = PRODUCTS.slice(0,3);
    featured.forEach(p => {
      const card = document.createElement('div'); card.className = 'card';
      card.innerHTML = `
        <div style="position: relative;">
          ${p.discount > 0 ? `<div class="discount-badge">SAVE ${p.discount}%</div>` : ''}
          <img src="${p.img}" alt="${p.title}" style="width: 100%; height: 200px; object-fit: cover;">
        </div>
        <div style="padding: 1rem;">
          <h3 style="margin: 0 0 0.5rem 0;">${p.title}</h3>
          
          <div class="rating">
            <span style="font-size: 0.95rem;">${renderStars(p.rating)}</span>
            <span style="font-size: 0.8rem; color: #999; margin-left: 0.5rem;">(${p.reviews})</span>
          </div>
          
          <div class="price" style="margin: 0.75rem 0; font-size: 1.2rem; font-weight: bold;">
            ${formatPrice(p.price, p.discount)}
          </div>
          
          <p style="color:#64748b; font-size:13px; margin: 0.5rem 0;">${p.desc}</p>
          
          <div style="display:flex; gap:8px; margin-top: 1rem;">
            <button data-id="${p.id}" style="flex: 1; padding: 0.6rem; background: #2563eb; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; transition: all 0.3s;">Add to cart</button>
            <a href="product.html" class="btn" style="background:#e2e8f0; color:#0f172a; display:inline-flex; align-items:center; text-decoration: none; padding: 0.6rem 1rem; border-radius: 6px;">View</a>
          </div>
        </div>`;
      featuredRoot.appendChild(card);
    });

    featuredRoot.addEventListener('click', e => {
      const btn = e.target.closest('button');
      if (!btn) return;
      addToCart(btn.dataset.id, 1);
      toast('✓ Added to cart');
    });
  </script>
</body>
</html>
