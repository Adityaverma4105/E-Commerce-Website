<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Shoply — Products</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="newstyle.css" />
  <link rel="stylesheet" href="features.css" />
</head>
<body>
  <header class="header">
    <div class="container nav">
      <a href="index.html" class="brand">Shoply</a>
      <div class="navlinks" style="display: flex; align-items: center;">
        <a href="product.html" class="btn">Products</a>
        <a href="cart.html" class="btn">Cart</a>
        <button id="wishlistToggle" class="wishlist-toggle" title="View Wishlist">
          ❤️
          <span class="wishlist-badge" id="wishlistBadge">0</span>
        </button>
      </div>
    </div>
  </header>

  <main class="container">
    <h1>Shop Our Products</h1>
    
    <!-- Search & Filter Section -->
    <div class="search-container">
      <input type="text" id="searchInput" placeholder="Search products...">
      <select id="sortSelect" class="filter-btn" style="padding: 0.75rem 1rem; background: #2563eb; color: white; border: none; cursor: pointer;">
        <option value="newest">Newest</option>
        <option value="price-low">Price: Low to High</option>
        <option value="price-high">Price: High to Low</option>
        <option value="rating">Top Rated</option>
      </select>
    </div>

    <!-- Price Filter -->
    <div class="price-filter">
      <label for="priceRange">Filter by Price: <strong id="priceValue">$0 - $200</strong></label>
      <input type="range" id="priceRange" min="0" max="200" value="200" style="margin-top: 0.5rem;">
    </div>

    <!-- Products Grid -->
    <div id="productGrid" class="grid"></div>

    <!-- No Results Message -->
    <div id="noResults" class="no-results" style="display: none;">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
      </svg>
      <h3>No products found</h3>
      <p>Try adjusting your search or filters</p>
    </div>
  </main>

  <!-- Wishlist Sidebar -->
  <div class="wishlist-container" id="wishlistSidebar">
    <div class="wishlist-header">
      <h2 style="margin: 0;">My Wishlist</h2>
      <button class="wishlist-close" id="wishlistClose">✕</button>
    </div>
    <div id="wishlistItems"></div>
    <div style="margin-top: 1.5rem; padding-top: 1rem; border-top: 2px solid #e2e8f0;">
      <button id="clearWishlist" style="width: 100%; padding: 0.8rem; background: #ef4444; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; transition: all 0.3s;">
        Clear Wishlist
      </button>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    const grid = document.getElementById('productGrid');
    const searchInput = document.getElementById('searchInput');
    const sortSelect = document.getElementById('sortSelect');
    const priceRange = document.getElementById('priceRange');
    const priceValue = document.getElementById('priceValue');
    const noResults = document.getElementById('noResults');
    const wishlistToggle = document.getElementById('wishlistToggle');
    const wishlistSidebar = document.getElementById('wishlistSidebar');
    const wishlistClose = document.getElementById('wishlistClose');
    const wishlistItems = document.getElementById('wishlistItems');
    const wishlistBadge = document.getElementById('wishlistBadge');
    const clearWishlistBtn = document.getElementById('clearWishlist');

    let filteredProducts = [...PRODUCTS];

    function formatPrice(price, discount) {
      if (discount && discount > 0) {
        const discountedPrice = price * (1 - discount / 100);
        return `<span style="text-decoration: line-through; color: #999; font-size: 0.9rem;">$${price.toFixed(2)}</span> 
                <span style="color: #ef4444; font-weight: bold;">$${discountedPrice.toFixed(2)}</span>`;
      }
      return `$${price.toFixed(2)}`;
    }

    function renderStars(rating) {
      const fullStars = Math.floor(rating);
      const hasHalf = rating % 1 !== 0;
      let stars = '★'.repeat(fullStars);
      if (hasHalf) stars += '½';
      stars += '☆'.repeat(5 - Math.ceil(rating));
      return stars;
    }

    function render(products = PRODUCTS) {
      grid.innerHTML = '';
      
      if (products.length === 0) {
        noResults.style.display = 'block';
        return;
      }
      
      noResults.style.display = 'none';
      
      products.forEach(p => {
        const el = document.createElement('div'); 
        el.className = 'card';
        const isWishlisted = isInWishlist(p.id);
        const discountedPrice = p.discount > 0 ? (p.price * (1 - p.discount / 100)).toFixed(2) : p.price;
        
        el.innerHTML = `
          <div style="position: relative;">
            ${p.discount > 0 ? `<div class="discount-badge">SAVE ${p.discount}%</div>` : ''}
            <button class="wishlist-btn ${isWishlisted ? 'active' : ''}" data-id="${p.id}" title="Add to Wishlist">
              ${isWishlisted ? '❤️' : '🤍'}
            </button>
            <img src="${p.img}" alt="${p.title}" style="width: 100%; height: 200px; object-fit: cover;">
          </div>
          
          <div style="padding: 1rem;">
            <h3 style="margin: 0 0 0.5rem 0; font-size: 1.1rem;">${p.title}</h3>
            
            <div class="rating">
              <span style="font-size: 1rem;">${renderStars(p.rating)}</span>
              <span style="font-size: 0.85rem; color: #999; margin-left: 0.5rem;">(${p.reviews} reviews)</span>
            </div>
            
            <div class="price" style="margin: 0.75rem 0; font-size: 1.3rem; font-weight: bold;">
              ${formatPrice(p.price, p.discount)}
            </div>
            
            <p style="color:#64748b; font-size:13px; margin: 0.5rem 0;">${p.desc}</p>

            <div class="card-actions">
              <input class="qty-input" type="number" min="1" value="1" style="width: 70px; padding: 0.6rem; border: 2px solid #e2e8f0; border-radius: 6px;">
              <button class="add-btn" data-id="${p.id}" style="flex: 1; padding: 0.6rem; background: #2563eb; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; transition: all 0.3s;">
                Add to Cart
              </button>
            </div>
          </div>
        `;
        grid.appendChild(el);
      });

      updateWishlistUI();
    }

    function filterAndSort() {
      const query = searchInput.value;
      const maxPrice = Number(priceRange.value);
      const sortBy = sortSelect.value;

      let results = PRODUCTS;

      // Search
      if (query) {
        results = searchProducts(query);
      }

      // Price filter
      results = results.filter(p => p.price <= maxPrice);

      // Sort
      results = sortProducts(results, sortBy);

      filteredProducts = results;
      render(results);
    }

    function updateWishlistUI() {
      const wishlist = readWishlist();
      wishlistBadge.textContent = wishlist.length;

      wishlistItems.innerHTML = '';
      if (wishlist.length === 0) {
        wishlistItems.innerHTML = '<p style="text-align: center; color: #999; padding: 2rem 0;">Your wishlist is empty</p>';
        return;
      }

      wishlistItemsDetailed().forEach(item => {
        const el = document.createElement('div');
        el.className = 'wishlist-item';
        el.innerHTML = `
          <div>
            <strong>${item.title}</strong><br>
            <span style="color: #2563eb; font-weight: 600;">$${item.price.toFixed(2)}</span>
          </div>
          <button class="wishlist-item-remove" data-id="${item.id}">Remove</button>
        `;
        wishlistItems.appendChild(el);
      });
    }

    // Event Listeners
    grid.addEventListener('click', (e) => {
      const wishBtn = e.target.closest('.wishlist-btn');
      if (wishBtn) {
        const productId = wishBtn.dataset.id;
        toggleWishlist(productId);
        filterAndSort();
        return;
      }

      const addBtn = e.target.closest('.add-btn');
      if (addBtn) {
        const card = addBtn.closest('.card');
        const qty = Number(card.querySelector('.qty-input').value) || 1;
        const productId = addBtn.dataset.id;
        addToCart(productId, qty);
        toast(`✓ Added ${qty} to cart`);
        addBtn.textContent = 'Added!';
        setTimeout(() => addBtn.textContent = 'Add to Cart', 1500);
      }
    });

    wishlistItems.addEventListener('click', (e) => {
      const removeBtn = e.target.closest('.wishlist-item-remove');
      if (removeBtn) {
        removeFromWishlist(removeBtn.dataset.id);
        updateWishlistUI();
        filterAndSort();
      }
    });

    searchInput.addEventListener('input', filterAndSort);
    sortSelect.addEventListener('change', filterAndSort);
    priceRange.addEventListener('input', (e) => {
      priceValue.textContent = `$0 - $${e.target.value}`;
      filterAndSort();
    });

    wishlistToggle.addEventListener('click', () => {
      wishlistSidebar.classList.toggle('open');
    });

    wishlistClose.addEventListener('click', () => {
      wishlistSidebar.classList.remove('open');
    });

    clearWishlistBtn.addEventListener('click', () => {
      writeWishlist([]);
      updateWishlistUI();
      filterAndSort();
      toast('✓ Wishlist cleared');
    });

    render();
  </script>
</body>
</html>
